# Reticulum bootstrap config example for Node.start_from_config/2

[node]
storage_path = "~/.reticulum"
transport_enabled = true
use_implicit_proof = true
shared_instance = false
# startup_mode: "cold" | "warm_restore"
# warm_restore currently runs restore hooks while ETS runtime tables stay ephemeral.
startup_mode = "cold"
path_ttl_seconds = 300
path_gc_interval_seconds = 5
routing_max_hops = 128
announce_forwarding = true
path_request_forwarding = true
path_request_timeout_seconds = 15
path_request_retry_count = 1
path_request_retry_base_seconds = 5
path_request_retry_backoff_factor = 2
path_request_min_interval_seconds = 20
path_request_duplicate_ttl_seconds = 15
path_request_fanout = 2
interface_queue_limit = 64
interface_backpressure = "reject"
# interface_rate_limit_bytes_per_second = 65536
# interface_rate_limit_packets_per_second = 128
# interface_rate_limit_burst_bytes = 131072
# interface_rate_limit_burst_packets = 256
receipt_timeout_seconds = 10
receipt_retention_seconds = 60
ratchet_expiry_seconds = 2592000

[interfaces.link]
type = "udp"
enabled = true
listen_ip = "127.0.0.1"
listen_port = 43001
default_peer_ip = "127.0.0.1"
default_peer_port = 43002
# Optional authenticated IFAC transport.
# Enable on all peers that share this interface segment.
# ifac_netname = "mesh-alpha"
# ifac_netkey = "change-me"
# ifac_size_bits = 128
queue_limit = 32
backpressure = "drop_oldest"
# rate_limit_packets_per_second = 64

[interfaces.backup]
type = "udp"
enabled = false
listen_ip = "127.0.0.1"
listen_port = 43003
# module = "Reticulum.MyCustomInterface"
